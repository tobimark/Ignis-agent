[workspace]
resolver = "3"
members = [
    "apps/cli",
    "packages/core",
    "packages/gateway",
    "packages/runtime",
    "packages/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
# 内部 crate 用 path 依赖，成员 crate 以 `{ workspace = true }` 引入
ignis-core = { path = "packages/core" }
ignis-gateway = { path = "packages/gateway" }
ignis-runtime = { path = "packages/runtime" }
ignis-storage = { path = "packages/storage" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "io-util", "fs"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
libc = "0.2"
